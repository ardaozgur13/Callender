{% extends "base.html" %}

{% block title %}Giriş{% endblock %}

{% block guest_content %}
  <section class="card auth-card" aria-labelledby="login-title">
    <h1 id="login-title">Tekrar hoş geldin</h1>
    <p class="muted">Takvimin, buzdolabın ve ev işlerin seni bekliyor.</p>
    <form method="post" novalidate>
      {% csrf_token %}
      {% include "includes/form.html" with form=form %}
      <input type="hidden" name="next" value="{{ next }}">
      <button class="btn btn--block" type="submit">Giriş yap</button>
    </form>
    <p class="auth-switch">Hesabın yok mu? <a href="{% url 'register' %}">Kayıt ol</a></p>
  </section>
{% endblock %}
